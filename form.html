<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>STUDENT INFORMATION FORM</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; 
  background-image:url('non.png'); 
  background-size:cover;
  background-repeat: no-repeat;
  background-position: center;
  background-attachment: fixed;
 padding:20px; }
    .container { max-width:700px; margin:0 auto; background-image:url('fom2.png'); 
  background-size:cover;
  background-repeat: no-repeat;
  background-position: center;
  background-attachment: fixed;  padding:24px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
    h1 { margin-top:0; font-size:22px; color:#333; }
    label { display:block; margin:12px 0 6px; font-weight:600; color:#444; }
    input[type="text"], input[type="email"], input[type="date"], textarea, select {
      width:100%; padding:10px; border:1px solid #d0d6dc; border-radius:6px; box-sizing:border-box;
    }
    textarea { min-height:80px; }
    .row { display:flex; gap:12px; }
    .col { flex:1; }
    .actions { margin-top:18px; text-align:right; }
    button {background:#2b8aef; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; }
    button:hover { opacity:0.95; }
    .note { font-size:13px; color:#666; margin-top:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>STUDENT INFORMATION FROM</h1>
    <form method="post" action="/cgi-bin/student_info.cgi" enctype="application/x-www-form-urlencoded">
      <label>Full Name *</label>
      <input name="full_name" type="text" required placeholder="Enter your name">

      <div class="row">
        <div class="col">
          <label>Roll Number / Student ID *</label>
          <input name="roll_no" placeholder="Enter your Roll number" type="text" required >
        </div>
        <div class="col">
          <label>Class / Grade *</label>
          <input name="class_grade" type="text" required>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Section</label>
          <input name="section" placeholder="Enter your Section" type="text">
        </div>
        <div class="col">
          <label>Date of Birth</label>
          <input name="dob" type="date">
        </div>
      </div>

      <label>Gender</label>
      <select name="gender">
        <option value="">-- Select --</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label>Email Address *</label>
      <input name="email" type="email" required>

      <label>Phone Number *</label>
      <input name="phone" type="text" required>

      <label>Address</label>
      <textarea name="address"></textarea>

      <h3 style="margin-top:16px">Parent / Guardian</h3>
      <label>Parent / Guardian Name *</label>
      <input name="parent_name" type="text" required>

      <label>Parent Phone Number *</label>
      <input name="parent_phone" type="text" required>

      <label></label>
      
      <div>
      <button type="submit" style="background: green; color:white;">Submit</button>
      <button type="reset" style="background: red; color:white;">Reset</button>
      <button type="button" style="background: orange; color:white;">Cancel</button>
      </div>

      <p class="note">Form submits via POST to a CGI program. Make sure your server has /cgi-bin/student_info.cgi executable.</p>
    </form>
  </div>
</body>
</html>
